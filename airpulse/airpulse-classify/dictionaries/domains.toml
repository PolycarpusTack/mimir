# Domain keyword dictionaries for AirPulse classification.
# Each domain has a weighted keyword list. A domain is assigned
# if the sum of matched keyword weights exceeds the threshold (default: 2.0).

[broadcast]
threshold = 2.0
keywords = [
    { term = "broadcast", weight = 1.5 },
    { term = "broadcasting", weight = 1.5 },
    { term = "playout", weight = 2.0 },
    { term = "MAM", weight = 1.5 },
    { term = "media asset management", weight = 2.0 },
    { term = "master control", weight = 2.0 },
    { term = "ATSC", weight = 1.5 },
    { term = "DVB", weight = 1.5 },
    { term = "SMPTE", weight = 1.5 },
    { term = "SDI", weight = 1.5 },
    { term = "IP production", weight = 2.0 },
