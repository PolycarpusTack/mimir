[workspace]
members = [
    "airpulse-types",
    "airpulse-ingest",
    "airpulse-classify",
    "airpulse-store",
    "airpulse-enrich",
    "airpulse-baseline",
    "airpulse-api",
    "airpulse-digest",
    "airpulse-jira",
    "airpulse-scrape",
    "airpulse-ws",
    "airpulse-notify",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hive Department <hive@mediagenix.tv>"]
license = "Proprietary"

[workspace.dependencies]
# Shared dependencies across crates
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# HTTP / API
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }

# Feed parsing
feed-rs = "2"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Classification
regex = "1"
toml = "0.8"

# Testing
proptest = "1"
